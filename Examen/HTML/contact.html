<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caffè Luna</title>
</head>

<body>
    <header>
        <img src="img/logo.png" alt="">
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1>Contact</h1>
            <p>Heb je een vraag, suggestie of wil je reserveren? Vul het formulier in en we nemen snel contact met je
                op.
            </p>
            <form action="formulier">
                <div>
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="naam@voorbeeld.be">
                </div>
                <div>
                    <label for="onderwerp">Onderwerp</label>
                    <select id="onderwerp">
                        <option value="-1">Algemene vraag</option>
                    </select>
                </div>
                <div>
                    <label for="Bericht">Bericht</label>
                    <textarea id="Bericht" cols="40" rows="5" required placeholder="Typ je boodschap..."></textarea>
                </div>
                <div>
                    <label><input type="checkbox" checked> Ik wil de nieuwsbrief ontvangen</label>
                </div>
                <div>
                    <button type="submit">verzenden</button>
                </div>
            </form>
        </section>
        <section>
            <h2>Vind ons</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2517.448383817981!2d4.699933800000001!3d50.87841110000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c160d851703f0d%3A0xe802d373119b0717!2sOude%20Markt%201%2C%203000%20Leuven!5e0!3m2!1sfr!2sbe!4v1763047658690!5m2!1sfr!2sbe"
                width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
    </main>
    <footer>
        <address>
            🗺️ Oude Markt 1, 3000 Leuven <br>
            ✉️ <a href="mailto:hallo@caffeluna.tld">hallo@caffeluna.tld</a><br>
            📞 <a href="tel:+32412345678">0412/34.56.78</a>
        </address>
        <p>
            &copy; Caffè Luna - Alle rechten voorbehouden
        </p>
    </footer>
</body>

</html>
